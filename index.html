<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS TEAM VIP MOD </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Animations --- */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes fire-border {
            0% { --angle: 0deg; }
            100% { --angle: 360deg; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* --- Common Styles --- */
        .screen {
            display: none;
            height: calc(100% - 60px);
            width: 100%;
            overflow-y: auto;
            position: relative;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Login Screen --- */
        #login-screen {
            justify-content: center;
            background: #000;
        }

        .fire-box {
            position: relative;
            width: 320px;
            padding: 30px 20px;
            background: #050505;
            border-radius: 12px;
            text-align: center;
            
            /* RED FIRE ANIMATION LOGIC */
            background-image: linear-gradient(#050505, #050505), conic-gradient(from var(--angle), #ff0000, #ff5e00, #ff0000);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border: 3px solid transparent;
            animation: fire-border 2.5s linear infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 10px #ff0000;
        }
        
        /* Small profile for dashboard (Smaller now) */
        .dashboard-profile {
            width: 50px;
            height: 50px;
            margin-bottom: 5px;
            border-width: 1px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00ffea;
            border-radius: 5px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff0000, #8b0000);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* --- Hack Dashboard --- */
        #hack-screen {
            padding: 10px;
            background: black;
            justify-content: flex-start; 
            align-items: center;
            overflow-y: scroll;
        }

        .header-title {
             font-family: 'Orbitron', sans-serif;
             font-size: 16px; /* Smaller font */
             color: white;
             margin-bottom: 5px;
             text-shadow: 0 0 5px red;
        }

        /* --- WIN/LOSS COUNTER --- */
        .history-stats {
            display: flex;
            justify-content: center;
            gap: 10px; /* Reduced gap */
            margin-bottom: 10px;
            width: 100%;
        }

        .stat-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px; /* Smaller font */
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #333;
            min-width: 70px;
        }

        .win-stat {
            color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0,255,0,0.3);
        }

        .loss-stat {
            color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
            border-color: #ff0000;
            box-shadow: 0 0 5px rgba(255,0,0,0.3);
        }

        /* --- PREDICTION CARD (COMPACT VERSION) --- */
        .prediction-card {
            width: 100%;
            max-width: 350px;
            padding: 15px 10px; /* Reduced Padding */
            background: #080808;
            border-radius: 15px;
            text-align: center;
            position: relative;
            
            /* RED FIRE BORDER */
            background-image: linear-gradient(#080808, #080808), conic-gradient(from var(--angle), #ff0000, #ff8c00, #ff0000);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border: 3px solid transparent;
            animation: fire-border 3s linear infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 70px; /* Space for footer */
        }

        .card-label {
            color: #00ffea;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
            margin-top: 0px;
        }

        .period-display {
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; /* Smaller font */
            padding: 6px; /* Smaller padding */
            border-radius: 6px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            width: 100%;
        }

        .status-badge {
            font-size: 9px;
            color: #00ffea;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        /* Big/Small Result (Compact) */
        .result-wrapper {
            height: 70px; /* Reduced Height */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-size: 40px; /* Smaller Font */
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .big { color: #28a745; text-shadow: 0 0 15px #28a745; }
        .small { color: #dc3545; text-shadow: 0 0 15px #dc3545; }
        .shaking { animation: shake 0.4s infinite; }

        /* Timer Bar */
        .progress-container {
            width: 100%;
            height: 4px; /* Thinner bar */
            background: #222;
            border-radius: 5px;
            margin: 5px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff5e00);
            width: 100%;
            transition: width 1s linear;
            box-shadow: 0 0 5px #ff0000;
        }

        .timer-digit {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        .confidence-level {
            margin-top: 2px;
            color: #888;
            font-size: 10px;
            margin-bottom: 10px;
        }

        /* --- INTERNAL HISTORY TABLE (SCROLLABLE) --- */
        .internal-history-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .history-title {
            font-family: 'Orbitron', sans-serif;
            color: #00ffea;
            font-size: 11px;
            text-align: center;
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 3px;
            letter-spacing: 1px;
        }

        /* Wrapper for Scroll */
        .table-scroll-wrapper {
            max-height: 110px; /* Approx 5 rows */
            overflow-y: auto; /* Enable Scroll */
            scrollbar-width: thin; /* For Firefox */
            scrollbar-color: #ff0000 #111;
        }
        
        /* Scrollbar Style for Chrome/Safari */
        .table-scroll-wrapper::-webkit-scrollbar {
            width: 3px;
        }
        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #111;
        }
        .table-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #ff0000;
            border-radius: 3px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #ccc;
        }

        .history-table th {
            text-align: center;
            padding: 4px;
            color: #ff0000;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: #0a0a0a; /* Keep header visible */
            z-index: 1;
        }

        .history-table td {
            text-align: center;
            padding: 4px;
            border-bottom: 1px solid #222;
        }

        .row-win { color: #00ff00; }
        .row-loss { color: #ff0000; }
        .res-big { color: #28a745; }
        .res-small { color: #dc3545; }

        /* --- Telegram Button --- */
        .telegram-btn {
            display: block;
            width: 100%;
            padding: 8px; /* Compact */
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 12px;
            border-radius: 50px;
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            transition: transform 0.2s;
        }
        
        .telegram-btn:active {
            transform: scale(0.95);
        }

        /* --- Game Screen --- */
        #game-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Footer --- */
        .footer {
            height: 60px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 999;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #555;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: #fff;
            background: linear-gradient(to top, rgba(255, 0, 0, 0.1), transparent);
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 3px;
        }

        .nav-item:first-child.active::after { background: #ff00cc; box-shadow: 0 0 10px #ff00cc; }
        .nav-item:last-child.active::after { background: #00ffea; box-shadow: 0 0 10px #00ffea; }

    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="fire-box">
            <img src="https://ik.imagekit.io/ljcih9oti/IMG_20251206_181318_724.jpg" alt="Logo" class="profile-img">
            <h3 style="font-family: 'Orbitron'; margin-bottom: 10px;">SS TEAM VIP MOOD </h3>
            <input type="password" id="pass" class="input-field" placeholder="PASSWORD">
            <button class="action-btn" onclick="doLogin()">LOGIN NOW</button>
            <div id="err" style="color: red; font-size: 12px; margin-top: 10px; display: none;">Wrong Password!</div>
        </div>
    </div>

    <!-- 2. HACK SCREEN -->
    <div id="hack-screen" class="screen">
        
        <!-- MAIN PREDICTION BOX (COMPACT VERSION) -->
        <div class="prediction-card">
            
            <img src="https://ik.imagekit.io/ljcih9oti/IMG_20251206_181318_724.jpg" alt="Logo" class="profile-img dashboard-profile">
            <h3 class="header-title">SS TEAM VIP MOOD </h3>

            <!-- WIN/LOSS COUNTER -->
            <div class="history-stats">
                <div class="stat-box win-stat">WIN: <span id="win-count">0</span></div>
                <div class="stat-box loss-stat">LOSS: <span id="loss-count">0</span></div>
            </div>

            <div class="card-label">TARGET PERIOD</div>
            <div class="period-display" id="period">Loading...</div>

            <div class="status-badge">PREDICTION STATUS: ACTIVE</div>

            <div class="result-wrapper">
                <div id="result" class="result-text shaking">WAIT</div>
            </div>

            <div class="progress-container">
                <div class="progress-fill" id="bar"></div>
            </div>
            <div class="timer-digit" id="timer">30s</div>

            <div class="confidence-level" id="confidence">Confidence: --%</div>

            <!-- SCROLLABLE HISTORY TABLE INSIDE THE BOX -->
            <div class="internal-history-box">
                <div class="history-title">HISTORY RECORD</div>
                
                <!-- Wrapper for Scroll -->
                <div class="table-scroll-wrapper">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>PERIOD</th>
                                <th>RESULT</th>
                                <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <!-- Rows will be added here by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <a href="https://t.me/SS_TEAM_BD_X" target="_blank" class="telegram-btn">JOIN TELEGRAM</a>
        </div>
        
    </div>

    <!-- 3. GAME SCREEN -->
    <div id="game-screen" class="screen">
        <iframe src="https://tkclub5.com/#/register?invitationCode=45686101629"></iframe>
    </div>

    <!-- 4. FOOTER -->
    <div class="footer" id="footer" style="display: none;">
        <button class="nav-item active" onclick="nav('hack')">HACK</button>
        <button class="nav-item" onclick="nav('game')">GAME</button>
    </div>

    <script>
        // CONFIG
        const PASS = "SURIYAVIP01";

        // ELEMENTS
        const ui = {
            login: document.getElementById('login-screen'),
            hack: document.getElementById('hack-screen'),
            game: document.getElementById('game-screen'),
            footer: document.getElementById('footer'),
            passInput: document.getElementById('pass'),
            errMsg: document.getElementById('err'),
            period: document.getElementById('period'),
            result: document.getElementById('result'),
            bar: document.getElementById('bar'),
            timer: document.getElementById('timer'),
            conf: document.getElementById('confidence'),
            winLabel: document.getElementById('win-count'),
            lossLabel: document.getElementById('loss-count'),
            historyBody: document.getElementById('history-body')
        };

        // STATE VARIABLES
        let activePeriod = "";
        let currentPredictionText = ""; 
        
        let winCount = 0;
        let lossCount = 0;
        let isFirstLoad = true;

        // LOGIN
        function doLogin() {
            if (ui.passInput.value === PASS) {
                ui.login.style.display = 'none';
                ui.footer.style.display = 'flex';
                nav('hack');
                startSystem();
            } else {
                ui.errMsg.style.display = 'block';
            }
        }

        // NAVIGATION
        function nav(tab) {
            const btns = document.querySelectorAll('.nav-item');
            if (tab === 'hack') {
                ui.hack.style.display = 'flex';
                ui.game.style.display = 'none';
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
            } else {
                ui.hack.style.display = 'none';
                ui.game.style.display = 'block';
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
            }
        }

        // SYSTEM LOGIC
        function startSystem() {
            setInterval(update, 1000); // 1 sec loop
            update();
        }

        function update() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const bdTime = new Date(utc + (3600000 * 6));
            
            const yyyy = bdTime.getFullYear();
            const mm = String(bdTime.getMonth() + 1).padStart(2, '0');
            const dd = String(bdTime.getDate()).padStart(2, '0');
            
            const totalMins = (bdTime.getHours() * 60) + bdTime.getMinutes();
            const seconds = bdTime.getSeconds();
            
            let currentSeq = (totalMins * 2) + (seconds >= 30 ? 1 : 0);
            let nextSeq = currentSeq + 1; 

            const periodStr = `${yyyy}${mm}${dd}30${nextSeq}`;

            if (activePeriod !== periodStr) {
                
                if(!isFirstLoad && activePeriod !== "") {
                    addToHistory(activePeriod, currentPredictionText);
                }

                activePeriod = periodStr;
                ui.period.innerText = periodStr;
                isFirstLoad = false;
                
                newPrediction(); 
            }

            // Timer (30s countdown)
            const rem = 30 - (seconds % 30);
            ui.timer.innerText = rem + "s";
            ui.bar.style.width = ((rem / 30) * 100) + "%";
            
            if (rem <= 5) {
                ui.timer.style.color = "white"; 
                ui.bar.style.background = "red";
                ui.result.classList.remove('shaking');
            } else {
                ui.timer.style.color = "#ff0000";
                ui.bar.style.background = "linear-gradient(90deg, #ff0000, #ff5e00)";
                ui.result.classList.add('shaking');
            }
        }

        function newPrediction() {
            const isBig = Math.random() < 0.5;
            currentPredictionText = isBig ? "BIG" : "SMALL"; 
            
            ui.result.innerText = currentPredictionText;
            ui.result.className = "result-text shaking " + (isBig ? "big" : "small");
            
            const percentage = Math.floor(Math.random() * (95 - 60) + 60);
            ui.conf.innerText = "Confidence: " + percentage + "%";
        }

        function addToHistory(period, prediction) {
            const isWin = Math.random() < 0.7;
            
            if (isWin) {
                winCount++;
            } else {
                lossCount++;
            }
            
            ui.winLabel.innerText = winCount;
            ui.lossLabel.innerText = lossCount;

            const row = document.createElement('tr');
            
            const shortPeriod = period.slice(-4);
            
            const resultClass = prediction === "BIG" ? "res-big" : "res-small";
            const statusClass = isWin ? "row-win" : "row-loss";
            const statusText = isWin ? "WIN" : "LOSS";

            row.innerHTML = `
                <td>${shortPeriod}</td>
                <td class="${resultClass}">${prediction}</td>
                <td class="${statusClass}">${statusText}</td>
            `;

            // Insert at top of table
            ui.historyBody.insertBefore(row, ui.historyBody.firstChild);

            // Limit history to last 50 rows (so scrolling is useful but memory is managed)
            if (ui.historyBody.children.length > 50) {
                ui.historyBody.removeChild(ui.historyBody.lastChild);
            }
        }
    </script>
</body>
</html>
